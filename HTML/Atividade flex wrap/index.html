<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Wrap</title>
    <link rel="stylesheet" href="style.css">
 </head>
  <body>
    <div class="container">
      <header>
        <h1>Header</h1>
      </header>

      <nav>
        <h2>Nav</h2>
      </nav>

      <div class="principal">

          <h2>Div - lateral</h2>
            <figure>
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/00/Minecraft_Alex_and_fauna.png?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original"
                 alt="alex do minecraft">
            </figure>
        </div>

        <section>
          <h2>Section</h2>
          <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTI6bWMnfKvRLQawmHpsoiGVjyg9E7qUSvhUo_krFEdvdSoKVsQHLKPOF0&s=10"
             alt="Stve e alex do minecraft">
          </figure>
        </section>

        <aside>
          <h2>Aside</h2>          
          <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoGHoKL3PAkUces611XFDkmNxzx7IAvDj8CM9nxAbuZw&s=10"
             alt="Stve e alex do minecraft">
          </figure>
        </aside>
      </div>

      <footer>
        <h2>Rodapé</h2>
      </footer>
    </div>
  </body>
</html>
